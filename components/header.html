    <!-- Main Header -->
    <div class="main-header">
        <div class="container-wrapper header-flex">
            <!-- Logo -->
            <a href="index.html" class="logo-area">
                <img src="../images/logo-icon.png" alt="Central Hardwares" class="system-logo-icon">
                <div class="logo-text">
                    <h2>Central</h2>
                    <span>HARDWARES</span>
                </div>
            </a>

            <!-- Search Bar (Clock + Sales Pulse) -->
            <div class="header-search header-search-bar">
                <div class="clock-container">
                    <div class="clock-block">
                        <span id="c-hours" class="clock-time">--</span>
                        <span class="clock-label">Hours</span>
                    </div>
                    <span class="clock-sep">:</span>
                    <div class="clock-block">
                        <span id="c-mins" class="clock-time">--</span>
                        <span class="clock-label">Mins</span>
                    </div>
                    <span class="clock-sep">:</span>
                    <div class="clock-block">
                        <span id="c-secs" class="clock-time">--</span>
                        <span class="clock-label">Secs</span>
                    </div>
                    <span class="clock-sep">:</span>
                    <div class="clock-block">
                        <span id="c-session" class="clock-time">--</span>
                        <span class="clock-label">Session</span>
                    </div>
                </div>

                <!-- Low Stock Widget -->
                <a href="inventory.html" class="low-stock-widget severity-ok">
                    <div class="stock-warning-icon">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                    </div>
                    <div class="stock-info">
                        <span id="low-stock-count-header">0</span>
                        <p>Items Critically Low</p>
                    </div>
                </a>
            </div>

            <!-- Icons -->
            <div class="header-icons">
                <!-- Notification Bell -->
                <div class="icon-item" id="notification-bell" onclick="toggleNotifications()">
                    <i class="fa-solid fa-bell"></i>
                    <span>Alerts</span>
                </div>
                <div class="icon-item" onclick="window.location.href='admin.html'">
                    <i class="fa-solid fa-user"></i>
                    <span>Admin</span>
                </div>
                <div class="icon-item" onclick="window.location.href='activity.html'">
                    <i class="fa-solid fa-chart-line"></i>
                    <span>Activity</span>
                </div>
                <div class="icon-item" onclick="window.location.href='reports.html'">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>Report</span>
                </div>
                <div class="icon-item dark-mode-toggle" onclick="toggleDarkMode()">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark</span>
                </div>
                <div class="icon-item settings-icon" onclick="window.location.href='account.html'">
                    <i class="fa-solid fa-gear" style="color: #f97316;"></i>
                    <span>Settings</span>
                </div>
                <div class="icon-item logout-btn-header" onclick="window.logout()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span style="color: #ef4444;">Logout</span>
                </div>
            </div>
        </div>
    </div>
